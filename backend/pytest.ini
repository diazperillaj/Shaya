[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --import-mode=importlib
# Deprecaciones preexistentes de los módulos del núcleo (config estilo
# Pydantic v1, Query.get). Se silencian solo en esos módulos: en código nuevo
# siguen visibles.
filterwarnings =
    ignore:Valid config keys have changed in V2:UserWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20:app\.(api|schemas)\.
    ignore::sqlalchemy.exc.LegacyAPIWarning:app\.api\.
    ignore:`empty_to_none` overrides:UserWarning:app\.schemas\.
